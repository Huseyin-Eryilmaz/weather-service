# Alembic configuration. Alembic manages database migrations: versioned,
# ordered scripts that evolve the schema. Instead of editing tables by
# hand, you generate a migration from the model changes and apply it —
# and the same sequence runs identically on every machine and in CI.

[alembic]
script_location = alembic
prepend_sys_path = src
# The actual database URL is injected from settings in env.py, not read
# from here, so the one source of truth stays in the environment.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
